<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{標題}｜AI 隨身筆記</title>
  <meta name="description" content="{一句話摘要}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <!-- 樣板：複製後依 AGENTS.md 第 5、8 節填寫。請勿刪除本檔，也不要放進首頁目錄。 -->
  <header class="site-bar">
    <div class="wrap">
      <a class="brand" href="../index.html">AI <span>隨身筆記</span></a>
      <nav><a href="../index.html">全部筆記</a></nav>
    </div>
  </header>

  <main class="wrap">
    <article class="note">

      <!-- 1. 頁首 -->
      <header class="note-head">
        <div class="num">NOTE {NNN}</div>
        <h1>{標題}</h1>
        <p class="summary">{一句話摘要}</p>
        <div class="tags"><span class="tag">{標籤1}</span><span class="tag">{標籤2}</span></div>
      </header>

      <!-- 2. 一句話解釋（30 字以內） -->
      <section class="tldr">
        <span class="label">一句話解釋</span>
        <p>{一句話，30 字以內}</p>
      </section>

      <!-- 3. 核心概念（3～5 點） -->
      <section>
        <h2>核心概念</h2>
        <ul>
          <li>{重點一}</li>
          <li>{重點二}</li>
          <li>{重點三}</li>
        </ul>
      </section>

      <!-- 4. 生活化例子 -->
      <div class="example">
        <h2>生活化例子</h2>
        <p>{一個貼近大學生生活的比喻}</p>
      </div>

      <!-- 5. 常見誤解（1～3 個） -->
      <div class="pitfall">
        <h2>常見誤解</h2>
        <ul>
          <li>很多人以為 {…}，其實 {…}。</li>
        </ul>
      </div>

      <!-- 6. 小練習（1 題） -->
      <details class="quiz">
        <summary>小練習：{題目}</summary>
        <p>{答案與解說}</p>
      </details>

      <!-- 7. 延伸閱讀（選填，不需要就整段刪掉） -->
      <section>
        <h2>延伸閱讀</h2>
        <ul>
          <li><a href="{NNN-slug}.html">{站內其他筆記}</a></li>
        </ul>
      </section>

      <!-- 8. 上一頁／下一頁 -->
      <nav class="pager">
        <a class="prev" href="{上一篇}.html"><small>← 上一篇</small>{上一篇標題}</a>
        <a class="next" href="{下一篇}.html"><small>下一篇 →</small>{下一篇標題}</a>
      </nav>

    </article>
  </main>

  <footer class="site-foot">
    <div class="wrap"><a href="../index.html">← 回到全部筆記</a></div>
  </footer>
</body>
</html>
